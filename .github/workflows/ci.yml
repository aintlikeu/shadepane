# Сборка и тесты на каждый push/PR в main и develop; при теге vX.Y.Z — релиз: архив, установщик и SHA256SUMS.txt.
# Ветки: develop — текущая работа; main — стабильная, в неё сливается develop при выпуске версии.
# Сторонние actions закреплены по SHA коммита (метку версии можно переписать, SHA — нет).
name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Подпись кода включается, когда в репозитории заданы переменные/секреты Azure Artifact Signing (см. docs/MAINTAINING.md, «Code signing»).
      SIGNING_CONFIGURED: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Тег должен быть вида vX.Y.Z: $env:GITHUB_REF_NAME" }
            $v = $Matches[1]
          } else {
            $v = '0.0.0'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet publish src/Shadepane.App/Shadepane.App.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -o publish/Shadepane

      # Подписываем только свои файлы (библиотеки .NET уже подписаны Microsoft) и только релизные сборки (теги).
      - name: Sign app binaries (Azure Artifact Signing)
        if: env.SIGNING_CONFIGURED == 'true' && github.ref_type == 'tag'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\publish\Shadepane\Shadepane.exe
            ${{ github.workspace }}\publish\Shadepane\Shadepane.dll
            ${{ github.workspace }}\publish\Shadepane\Shadepane.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (zip + installer)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Shadepane -DestinationPath "dist/Shadepane-$env:VERSION-win-x64.zip"
          # Inno Setup предустановлен в образах windows-2022/2025 (runner-images)
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) not found on the runner' }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\publish\Shadepane" installer/Shadepane.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign installer (Azure Artifact Signing)
        if: env.SIGNING_CONFIGURED == 'true' && github.ref_type == 'tag'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Shadepane-${{ steps.version.outputs.value }}-win-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Контрольные суммы — после подписи: подпись меняет файл.
      - name: Checksums
        shell: pwsh
        run: |
          # Формат sha256sum: "<hex>  <имя>". Автообновление сверяет установщик по этому файлу.
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shadepane-win-x64
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только эта задача и только для тегов может создать релиз
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Shadepane-win-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --title "Shadepane $TAG" --generate-notes
