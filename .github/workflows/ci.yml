# Сборка и тесты на каждый push/PR; при теге vX.Y.Z — релиз с архивом Shadepane-<версия>-win-x64.zip.
# Сторонние actions закреплены по SHA коммита (метку версии можно переписать, SHA — нет).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Тег должен быть вида vX.Y.Z: $env:GITHUB_REF_NAME" }
            $v = $Matches[1]
          } else {
            $v = '0.0.0'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet publish src/Shadepane.App/Shadepane.App.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -o publish/Shadepane
          Compress-Archive -Path publish/Shadepane -DestinationPath "Shadepane-$env:VERSION-win-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shadepane-win-x64
          path: Shadepane-*-win-x64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только эта задача и только для тегов может создать релиз
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Shadepane-win-x64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" Shadepane-*-win-x64.zip --title "Shadepane $TAG" --generate-notes
